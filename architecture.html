<!doctype html><html><head><meta charset="utf-8"><title>Airlock Architecture</title>
<style>body{margin:0;background:#020617}</style></head>
<body>
<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ff4d4f"/></marker>
  </defs>
  <rect width="1300" height="640" fill="#020617"/>
  <text x="34" y="42" fill="#e2e8f0" font-size="29" font-weight="800">🛰 Airlock</text>
  <text x="185" y="42" fill="#94a3b8" font-size="16">Enterprise AI Agent Platform ― security is the strength</text>
  <text x="34" y="66" fill="#38bdf8" font-size="13" font-weight="700">Track: Fortified Enterprise Fleet　·　多層防御 = Model Armor(言語層) + 決定的ポリシー(行動層)</text>

  <!-- User -->
  <rect x="26" y="120" width="150" height="80" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="101" y="150" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">管理者 / Web UI</text>
  <text x="101" y="172" fill="#94a3b8" font-size="11" text-anchor="middle">/new · /run · /dashboard</text>

  <!-- Generator -->
  <rect x="26" y="214" width="150" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="38" y="238" fill="#38bdf8" font-size="12" font-weight="800">① GENERATOR</text>
  <text x="38" y="258" fill="#e2e8f0" font-size="12">SOP → 最小権限spec</text>
  <text x="38" y="276" fill="#22c55e" font-size="11" font-weight="700">Gemini 3.5 (Vertex)</text>
  <text x="38" y="292" fill="#94a3b8" font-size="10.5">構造化出力</text>

  <!-- Registry -->
  <rect x="26" y="314" width="150" height="74" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="38" y="338" fill="#38bdf8" font-size="12" font-weight="800">② FLEET REGISTRY</text>
  <text x="38" y="358" fill="#e2e8f0" font-size="12">艦隊・最小権限</text>
  <text x="38" y="376" fill="#f59e0b" font-size="11" font-weight="700">Firestore</text>

  <!-- Attack battery -->
  <rect x="26" y="402" width="150" height="110" rx="12" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="38" y="426" fill="#ff4d4f" font-size="12" font-weight="800">攻撃バッテリー</text>
  <text x="38" y="445" fill="#cbd5e1" font-size="10.5">間接/直接インジェクション</text>
  <text x="38" y="461" fill="#cbd5e1" font-size="10.5">データ持ち出し</text>
  <text x="38" y="477" fill="#cbd5e1" font-size="10.5">不可逆操作の無承認</text>
  <text x="38" y="493" fill="#64748b" font-size="10">＋誤検知対照</text>

  <!-- Runtime with two layers -->
  <rect x="212" y="112" width="560" height="418" rx="14" fill="#0b1220" stroke="#334155"/>
  <text x="228" y="138" fill="#e2e8f0" font-size="13" font-weight="800">GOVERNED RUNTIME</text>
  <text x="756" y="138" fill="#22c55e" font-size="11" font-weight="700" text-anchor="end">Google ADK · Cloud Run</text>

  <!-- Layer 1: Model Armor -->
  <rect x="230" y="152" width="524" height="74" rx="10" fill="#150f22" stroke="#a78bfa"/>
  <text x="246" y="176" fill="#a78bfa" font-size="13" font-weight="800">Layer 1 ― Model Armor（言語層）</text>
  <text x="246" y="197" fill="#cbd5e1" font-size="11.5">受信プロンプトをMLで検査 → プロンプトインジェクション/脱獄/悪性URIを入力段で遮断</text>
  <text x="246" y="215" fill="#94a3b8" font-size="11">sanitizeUserPrompt（露骨な攻撃はここで落ちる）</text>

  <!-- arrow down between layers -->
  <line x1="492" y1="226" x2="492" y2="240" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Layer 2: agent + interceptor + policy -->
  <rect x="230" y="240" width="524" height="216" rx="10" fill="#0b1526" stroke="#38bdf8"/>
  <text x="246" y="262" fill="#38bdf8" font-size="13" font-weight="800">Layer 2 ― 決定的ポリシー（行動層）</text>

  <rect x="246" y="274" width="492" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="260" y="292" fill="#e2e8f0" font-size="12.5" font-weight="700">エージェント × N体 (Gemini) が実タスクを遂行</text>
  <text x="260" y="309" fill="#94a3b8" font-size="10.5">ADK before_tool_callback = 実行前に遮断 / after_tool = 出力の検疫(ベストエフォート)</text>

  <rect x="246" y="326" width="492" height="52" rx="8" fill="#0f172a" stroke="#22c55e"/>
  <text x="260" y="347" fill="#22c55e" font-size="12.5" font-weight="800">Policy Engine（決定的ルール）</text>
  <text x="260" y="366" fill="#cbd5e1" font-size="10.5">最小権限 / 高額は人間承認 / 送金先許可制 / 秘密・PIIの外部持出を遮断 / fail-closed</text>

  <rect x="246" y="386" width="492" height="56" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="260" y="407" fill="#e2e8f0" font-size="12" font-weight="700">実ツール（本物のGoogle Cloud副作用）</text>
  <text x="260" y="425" fill="#94a3b8" font-size="10.5">Firestore(注文/顧客/返金台帳/outbox) · 実HTTP送信 · 決済のみ模擬</text>

  <rect x="662" y="328" width="72" height="20" rx="6" fill="#22c55e"/><text x="698" y="343" fill="#000" font-size="10.5" font-weight="800" text-anchor="middle">ALLOW</text>
  <rect x="662" y="388" width="72" height="20" rx="6" fill="#ff4d4f"/><text x="698" y="403" fill="#000" font-size="10.5" font-weight="800" text-anchor="middle">BLOCK</text>

  <!-- Observability -->
  <rect x="806" y="112" width="466" height="120" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="822" y="136" fill="#38bdf8" font-size="12" font-weight="800">③ OBSERVABILITY</text>
  <text x="822" y="160" fill="#e2e8f0" font-size="12.5">監査証跡（全アクション・遮断理由・どの層で止めたか）</text>
  <text x="822" y="179" fill="#f59e0b" font-size="11" font-weight="700">Firestore + Cloud Logging</text>
  <text x="822" y="204" fill="#e2e8f0" font-size="12.5">監査イベント配信</text>
  <text x="822" y="222" fill="#a78bfa" font-size="11" font-weight="700">Pub/Sub (airlock-audit)</text>

  <!-- Scorecard -->
  <rect x="806" y="246" width="466" height="284" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="822" y="270" fill="#e2e8f0" font-size="13" font-weight="800">通信簿（決定的判定） · /dashboard</text>
  <text x="822" y="289" fill="#64748b" font-size="10">危険条件 danger() をポリシーと採点で共有 → ON突破0は"実行境界の強制"の構造的帰結</text>

  <rect x="822" y="302" width="212" height="210" rx="10" fill="#160b0b" stroke="#7f1d1d"/>
  <text x="928" y="326" fill="#fca5a5" font-size="12.5" text-anchor="middle" font-weight="700">Governance OFF</text>
  <text x="928" y="392" fill="#ff4d4f" font-size="52" text-anchor="middle" font-weight="800">＞0</text>
  <text x="928" y="418" fill="#94a3b8" font-size="11" text-anchor="middle">実害が発生(非決定)</text>
  <text x="928" y="440" fill="#94a3b8" font-size="10.5" text-anchor="middle">無承認返金が実行 /</text>
  <text x="928" y="456" fill="#94a3b8" font-size="10.5" text-anchor="middle">秘密が実際に外部へ</text>

  <rect x="1046" y="302" width="212" height="210" rx="10" fill="#07160d" stroke="#14532d"/>
  <text x="1152" y="326" fill="#86efac" font-size="12.5" text-anchor="middle" font-weight="700">Governance ON</text>
  <text x="1152" y="392" fill="#22c55e" font-size="52" text-anchor="middle" font-weight="800">0</text>
  <text x="1152" y="418" fill="#94a3b8" font-size="11" text-anchor="middle">突破0 · 誤検知0</text>
  <text x="1152" y="442" fill="#c4b5fd" font-size="10.5" text-anchor="middle">Armor遮断(言語) +</text>
  <text x="1152" y="458" fill="#7dd3fc" font-size="10.5" text-anchor="middle">Airlock遮断(行動)</text>

  <!-- arrows -->
  <line x1="176" y1="160" x2="208" y2="180" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="176" y1="250" x2="208" y2="220" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="176" y1="455" x2="228" y2="300" stroke="#ff4d4f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="772" y1="180" x2="804" y2="172" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="772" y1="410" x2="804" y2="300" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- footer badges -->
  <g font-size="11.5" font-weight="700">
    <rect x="34" y="556" width="150" height="28" rx="8" fill="#0f172a" stroke="#a78bfa"/><text x="109" y="575" fill="#a78bfa" text-anchor="middle">Model Armor</text>
    <rect x="196" y="556" width="196" height="28" rx="8" fill="#0f172a" stroke="#22c55e"/><text x="294" y="575" fill="#22c55e" text-anchor="middle">Gemini 3.5 · Vertex AI (global)</text>
    <rect x="404" y="556" width="104" height="28" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="456" y="575" fill="#38bdf8" text-anchor="middle">Google ADK</text>
    <rect x="520" y="556" width="104" height="28" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="572" y="575" fill="#38bdf8" text-anchor="middle">Cloud Run</text>
    <rect x="636" y="556" width="104" height="28" rx="8" fill="#0f172a" stroke="#f59e0b"/><text x="688" y="575" fill="#f59e0b" text-anchor="middle">Firestore</text>
    <rect x="752" y="556" width="104" height="28" rx="8" fill="#0f172a" stroke="#a78bfa"/><text x="804" y="575" fill="#a78bfa" text-anchor="middle">Pub/Sub</text>
  </g>
  <text x="34" y="612" fill="#64748b" font-size="11.5">SOP→最小権限生成→艦隊登録→[Layer1 Model Armorが言語層で露骨な攻撃を遮断]→[Layer2 決定的ポリシーが行動層で"一見まっとうな"違反を遮断]→実ツールで実タスク→全操作を監査→通信簿。判定はLLMでなく計装の事実。</text>
</svg>
</body></html>
