<!doctype html><html><head><meta charset="utf-8"><title>Airlock Architecture</title>
<style>body{margin:0;background:#020617}</style></head><body>
<svg viewBox="0 0 1340 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
 <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker></defs>
 <rect width="1340" height="760" fill="#020617"/>
 <text x="30" y="40" fill="#e2e8f0" font-size="27" font-weight="800">🛰 Airlock</text>
 <text x="175" y="40" fill="#94a3b8" font-size="16">Unattended agent operations on real data — run it unattended, not unguarded</text>
 <text x="30" y="63" fill="#38bdf8" font-size="12.5" font-weight="700">Track: Fortified Enterprise Fleet · Gemini 3.5 (Vertex) · ADK · Cloud Run · BigQuery · Firestore · Pub/Sub · Model Armor</text>

 <!-- ingest -->
 <rect x="26" y="92" width="234" height="104" rx="12" fill="#0f172a" stroke="#334155"/>
 <text x="40" y="115" fill="#38bdf8" font-size="12" font-weight="800">① SCAN AT SCALE</text>
 <text x="40" y="136" fill="#e2e8f0" font-size="12.5">3,458,906 real complaints</text>
 <text x="40" y="154" fill="#94a3b8" font-size="11">One scan reads 1.8 GB and returns</text>
 <text x="40" y="169" fill="#94a3b8" font-size="11">only the exceptions. No LLM sees 3.4M rows.</text>
 <text x="40" y="188" fill="#f59e0b" font-size="10.5" font-weight="700">bigquery-public-data.cfpb_complaints</text>

 <rect x="26" y="208" width="234" height="74" rx="12" fill="#0f172a" stroke="#334155"/>
 <text x="40" y="230" fill="#38bdf8" font-size="12" font-weight="800">② SUBMIT (POST /jobs)</text>
 <text x="40" y="250" fill="#e2e8f0" font-size="12">Returns a job_id in about 5 seconds</text>
 <text x="40" y="268" fill="#94a3b8" font-size="11">The work runs behind it (token required)</text>

 <rect x="26" y="294" width="234" height="96" rx="12" fill="#0f172a" stroke="#a78bfa"/>
 <text x="40" y="316" fill="#a78bfa" font-size="12" font-weight="800">Pub/Sub airlock-work</text>
 <text x="40" y="336" fill="#cbd5e1" font-size="11">ack 600s · an item takes 20–30s</text>
 <text x="40" y="353" fill="#cbd5e1" font-size="11">exponential backoff · DLQ after 5</text>
 <text x="40" y="371" fill="#94a3b8" font-size="10.5">push + OIDC → private worker only</text>

 <!-- CI gate -->
 <rect x="26" y="404" width="234" height="118" rx="12" fill="#1a1206" stroke="#f59e0b"/>
 <text x="40" y="426" fill="#f59e0b" font-size="12" font-weight="800">③ AGENT CI (re-proved on change)</text>
 <text x="40" y="446" fill="#cbd5e1" font-size="11">fingerprint = instruction + tools</text>
 <text x="40" y="463" fill="#cbd5e1" font-size="11">one edited sentence → pass goes stale</text>
 <text x="40" y="480" fill="#fca5a5" font-size="11">unverified agents get no real data</text>
 <text x="40" y="500" fill="#94a3b8" font-size="10.5">Also runs with governance OFF, so a</text>
 <text x="40" y="515" fill="#94a3b8" font-size="10.5">pass reports what it could test</text>

 <!-- runtime -->
 <rect x="292" y="92" width="596" height="524" rx="14" fill="#0b1220" stroke="#334155"/>
 <text x="308" y="116" fill="#e2e8f0" font-size="13" font-weight="800">GOVERNED RUNTIME (private Cloud Run worker, scales out)</text>
 <text x="872" y="116" fill="#22c55e" font-size="11" font-weight="700" text-anchor="end">Google ADK</text>

 <rect x="310" y="132" width="560" height="74" rx="10" fill="#150f22" stroke="#a78bfa"/>
 <text x="326" y="155" fill="#a78bfa" font-size="13" font-weight="800">L1 language — Model Armor</text>
 <text x="326" y="175" fill="#cbd5e1" font-size="11.5">Screens overt prompt injection and jailbreaks at the input (threshold HIGH)</text>
 <text x="326" y="194" fill="#94a3b8" font-size="10.5">LOW blocked a legitimate request, so the threshold was measured. L2 caught what slipped past.</text>

 <rect x="310" y="218" width="560" height="184" rx="10" fill="#0b1526" stroke="#38bdf8"/>
 <text x="326" y="240" fill="#38bdf8" font-size="13" font-weight="800">L2 action — deterministic policy (before_tool_callback)</text>
 <rect x="326" y="252" width="528" height="52" rx="8" fill="#0f172a" stroke="#1e293b"/>
 <text x="340" y="271" fill="#e2e8f0" font-size="12">Each department routes to its own agent, with its own tools</text>
 <text x="340" y="290" fill="#94a3b8" font-size="10.5">Support has no payment tool, so it hands the case to Finance to run under its own agent</text>
 <rect x="326" y="312" width="528" height="42" rx="8" fill="#0f172a" stroke="#22c55e"/>
 <text x="340" y="330" fill="#22c55e" font-size="11.5" font-weight="700">Over the limit → human · payee allowlisted · no secrets out · no memory poisoning</text>
 <text x="340" y="347" fill="#cbd5e1" font-size="10.5">Stopped before the tool runs. The judgement is a deterministic predicate, danger(), not the model.</text>
 <rect x="326" y="362" width="528" height="30" rx="8" fill="#0f172a" stroke="#334155"/>
 <text x="340" y="382" fill="#94a3b8" font-size="10.5">Real tools: Firestore ledger/outbox · real HTTP · code execution. Only payment is simulated.</text>

 <rect x="310" y="414" width="560" height="88" rx="10" fill="#1a1206" stroke="#f59e0b"/>
 <text x="326" y="436" fill="#f59e0b" font-size="13" font-weight="800">L3 execution — Cloud Run Sandbox (gVisor)</text>
 <text x="326" y="456" fill="#cbd5e1" font-size="11.5">Hijacked code still runs — but inside the sandbox there is no network to reach</text>
 <rect x="326" y="466" width="256" height="26" rx="6" fill="#160b0b" stroke="#7f1d1d"/>
 <text x="336" y="483" fill="#fca5a5" font-size="10.5">run directly: SA token stolen 🔴</text>
 <rect x="592" y="466" width="262" height="26" rx="6" fill="#07160d" stroke="#14532d"/>
 <text x="602" y="483" fill="#86efac" font-size="10.5">sandbox: network unreachable 🟢</text>

 <rect x="310" y="514" width="560" height="86" rx="10" fill="#0f172a" stroke="#334155"/>
 <text x="326" y="536" fill="#e2e8f0" font-size="12.5" font-weight="700">Outcomes and failure handling</text>
 <text x="326" y="556" fill="#cbd5e1" font-size="11">completed / escalated (to a person) / blocked / quarantined (unverified agent) / failed</text>
 <text x="326" y="574" fill="#94a3b8" font-size="10.5">Idempotent ledger: create() refunds/{item_id}. Transient errors free the lease; Pub/Sub retries.</text>
 <text x="326" y="591" fill="#94a3b8" font-size="10.5">Delivery is at-least-once, so "never pay twice" is enforced at the ledger, not hoped for.</text>

 <!-- right -->
 <rect x="920" y="92" width="394" height="150" rx="12" fill="#0f172a" stroke="#334155"/>
 <text x="936" y="115" fill="#38bdf8" font-size="12" font-weight="800">④ CASES (context that outlives the process)</text>
 <text x="936" y="137" fill="#e2e8f0" font-size="12">A pause becomes a case in Firestore</text>
 <text x="936" y="156" fill="#cbd5e1" font-size="11">Approving replays the context and resumes the work</text>
 <text x="936" y="175" fill="#cbd5e1" font-size="11">The approval is bound to that exact payload</text>
 <text x="936" y="193" fill="#94a3b8" font-size="10.5">Single use, and never reusable for another payee</text>
 <text x="936" y="214" fill="#94a3b8" font-size="10.5">— an approval cannot become a standing exception</text>
 <text x="936" y="232" fill="#f59e0b" font-size="10.5">Measured: resumed after waiting 27 hours</text>

 <rect x="920" y="254" width="394" height="118" rx="12" fill="#0f172a" stroke="#334155"/>
 <text x="936" y="277" fill="#38bdf8" font-size="12" font-weight="800">⑤ OBSERVABILITY</text>
 <text x="936" y="298" fill="#e2e8f0" font-size="12">Every action, every block, and which layer stopped it</text>
 <text x="936" y="317" fill="#f59e0b" font-size="11" font-weight="700">Firestore (runs / events / items) + Cloud Logging</text>
 <text x="936" y="337" fill="#e2e8f0" font-size="12">Each decision is written to the worker's log too</text>
 <text x="936" y="355" fill="#a78bfa" font-size="11" font-weight="700">Pub/Sub airlock-audit</text>

 <rect x="920" y="384" width="394" height="232" rx="12" fill="#0f172a" stroke="#334155"/>
 <text x="936" y="407" fill="#e2e8f0" font-size="13" font-weight="800">Measured, unattended</text>
 <rect x="936" y="420" width="176" height="86" rx="10" fill="#07160d" stroke="#14532d"/>
 <text x="1024" y="452" fill="#22c55e" font-size="34" text-anchor="middle" font-weight="800">200</text>
 <text x="1024" y="472" fill="#86efac" font-size="11" text-anchor="middle">items in 60 seconds</text>
 <text x="1024" y="492" fill="#94a3b8" font-size="10.5" text-anchor="middle">193 done · 5 escalated · 0 failed</text>
 <rect x="1122" y="420" width="176" height="86" rx="10" fill="#0b1526" stroke="#38bdf8"/>
 <text x="1210" y="452" fill="#38bdf8" font-size="34" text-anchor="middle" font-weight="800">0</text>
 <text x="1210" y="472" fill="#7dd3fc" font-size="11" text-anchor="middle">human interventions</text>
 <text x="1210" y="492" fill="#94a3b8" font-size="10.5" text-anchor="middle">nobody watching the run</text>
 <text x="936" y="528" fill="#cbd5e1" font-size="11">Whether an injection lands is model-dependent: 0/13 against</text>
 <text x="936" y="545" fill="#cbd5e1" font-size="11">a strict agent, 8/8 against one told to follow the record.</text>
 <text x="936" y="563" fill="#94a3b8" font-size="10.5">All were stopped at L2. Not every team writes a careful prompt.</text>
 <text x="936" y="583" fill="#e2e8f0" font-size="11" font-weight="700">Scored against what the company really did:</text>
 <text x="936" y="599" fill="#cbd5e1" font-size="10.5">94% recall · 41% precision · a constant answer would agree 65%</text>
 <text x="936" y="612" fill="#64748b" font-size="9.5">— a high-recall triage filter, and the dashboard says so</text>

 <line x1="143" y1="282" x2="143" y2="291" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

 <line x1="260" y1="460" x2="288" y2="420" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ar)"/>
 <line x1="888" y1="300" x2="916" y2="200" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>
 <line x1="888" y1="470" x2="916" y2="330" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar)"/>

 <text x="30" y="648" fill="#94a3b8" font-size="12.5" font-weight="700">Volume forces the automation. Change velocity forces the re-verification. Adversarial input forces enforcement at the boundary.</text>
 <text x="30" y="670" fill="#64748b" font-size="11">3.4M rows is not a reading task · agents are rewritten daily · the input is written by customers, which means by anyone</text>

  <rect x="172" y="692" width="86" height="26" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="215" y="710" fill="#38bdf8" text-anchor="middle">ADK</text>
  <rect x="268" y="692" width="110" height="26" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="323" y="710" fill="#38bdf8" text-anchor="middle">Cloud Run</text>
  <rect x="388" y="692" width="104" height="26" rx="8" fill="#0f172a" stroke="#f59e0b"/><text x="440" y="710" fill="#f59e0b" text-anchor="middle">BigQuery</text>
  <rect x="502" y="692" width="104" height="26" rx="8" fill="#0f172a" stroke="#f59e0b"/><text x="554" y="710" fill="#f59e0b" text-anchor="middle">Firestore</text>
  <rect x="616" y="692" width="98" height="26" rx="8" fill="#0f172a" stroke="#a78bfa"/><text x="665" y="710" fill="#a78bfa" text-anchor="middle">Pub/Sub</text>
  <rect x="724" y="692" width="128" height="26" rx="8" fill="#0f172a" stroke="#a78bfa"/><text x="788" y="710" fill="#a78bfa" text-anchor="middle">Model Armor</text>
  <rect x="862" y="692" width="152" height="26" rx="8" fill="#0f172a" stroke="#f59e0b"/><text x="938" y="710" fill="#f59e0b" text-anchor="middle">Cloud Run Sandbox</text>
 </g>
